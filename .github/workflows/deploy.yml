name: Deploy to all servers
on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button to deploy the latest main on demand
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: ${{ fromJson(vars.SERVERS) }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ matrix.server.port }} ${{ matrix.server.host }} >> ~/.ssh/known_hosts

      - name: Pull and deploy on ${{ matrix.server.name }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ matrix.server.port }} ${{ matrix.server.user }}@${{ matrix.server.host }} 'bash -s' <<'EOF'
          set -euo pipefail
          REPO='${{ matrix.server.repo_path }}'
          DEST='${{ matrix.server.deploy_path }}'
          EXPECTED='${{ github.sha }}'
          echo "Server:      $(hostname)"
          echo "Repo path:   $REPO"
          echo "Deploy path: $DEST"
          if [ ! -d "$DEST" ]; then
            echo "::error::Deploy path $DEST does not exist on this server - check deploy_path in the SERVERS variable"
            exit 1
          fi

          cd "$REPO"
          echo "Repo remote: $(git remote get-url origin)"
          git fetch --force origin main
          git reset --hard origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Deployed commit: $(git log -1 --format='%h  %s  (%ci)')"
          # The server's checkout must be the commit that triggered this run
          # (or a newer one pushed meanwhile) - otherwise origin points at the
          # wrong repository/branch and nothing new would be copied.
          if [ "$HEAD_SHA" != "$EXPECTED" ] && ! git merge-base --is-ancestor "$EXPECTED" "$HEAD_SHA" 2>/dev/null; then
            echo "::error::Server repo is at $HEAD_SHA but this run is for $EXPECTED - check the 'origin' remote of $REPO"
            exit 1
          fi

          cp -R "$REPO"/* "$DEST"/
          # cp * skips dotfiles: copy .htaccess explicitly (never .git)
          if [ -f "$REPO/.htaccess" ]; then cp -f "$REPO/.htaccess" "$DEST/.htaccess"; fi

          # Verify: every tracked file in the repo must now be identical in DEST.
          MISMATCH=0
          while IFS= read -r f; do
            case "$f" in
              .htaccess) ;;          # copied explicitly above, so check it
              .*) continue ;;        # other top-level dotfiles (.env.example, .gitignore, .github/, .cpanel.yml) are never deployed
            esac
            if ! cmp -s "$REPO/$f" "$DEST/$f"; then
              echo "::warning::Not updated in deploy path: $f"
              MISMATCH=$((MISMATCH + 1))
            fi
          done < <(git ls-files)
          if [ "$MISMATCH" -gt 0 ]; then
            echo "::error::$MISMATCH file(s) differ between $REPO and $DEST"
            exit 1
          fi
          echo "All tracked files verified in $DEST"

          # Build version shown in every footer: <commit date>V1.<n>, where n
          # counts commits on main since b7ec871 ("Update-nov06", the last
          # V1.19 build). Every new commit therefore raises the number by
          # one; re-running a deploy of the same commit keeps it unchanged.
          BASE_COMMIT='b7ec871'
          BASE_NUMBER=19
          if git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            BUILD=$(( BASE_NUMBER + $(git rev-list --count "$BASE_COMMIT..HEAD") ))
          else
            BUILD=$(git rev-list --count HEAD)
          fi
          VERSION="$(git log -1 --format=%cd --date=format:'%d-%b-%y')V1.${BUILD}"
          printf "<?php\n// Written by the deploy workflow - do not edit.\nreturn '%s';\n" "$VERSION" > "$DEST/config/version.php"
          echo "Build version: $VERSION"

          # Clear PHP OPcache / LiteSpeed cache if present, so the site serves the new code
          touch "$DEST/index.php" 2>/dev/null || true
          if [ -d "$DEST/.lscache" ]; then rm -rf "$DEST/.lscache"/* || true; fi
          EOF
