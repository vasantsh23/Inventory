name: Deploy to all servers
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: ${{ fromJson(vars.SERVERS) }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ matrix.server.port }} ${{ matrix.server.host }} >> ~/.ssh/known_hosts
      - name: Pull and deploy on ${{ matrix.server.name }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ matrix.server.port }} ${{ matrix.server.user }}@${{ matrix.server.host }} "cd ${{ matrix.server.repo_path }} && git fetch --force origin main && git reset --hard origin/main && cp -R ${{ matrix.server.repo_path }}/* ${{ matrix.server.deploy_path }}"
